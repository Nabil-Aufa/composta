title: Composta
description: Aplikasi desktop C# (WPF) yang membantu mengubah sampah organik menjadi kompos secara optimal melalui rekomendasi berbasis data cuaca real-time, sekaligus melacak estimasi emisi CO2e yang berhasil dicegah. Dibangun untuk mendukung aksi iklim (Climate Action) skala rumah tangga dan petani urban.